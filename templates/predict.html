{% extends "base.html" %}

{% block extra_head %}
<!-- Include Leaflet CSS & JS for the interactive map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    /* Styling for the picker map to ensure it expands and looks good */
    #picker-map {
        flex: 1;
        min-height: 400px;
        width: 100%;
        border-radius: 8px;
        border: 2px solid #dee2e6;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        cursor: crosshair; /* Changes cursor to indicate clicking */
    }
</style>
{% endblock %}

{% block content %}
<div class="row flex-grow-1 align-items-stretch mt-2 w-100 m-0">

    <!-- Left Column: Interactive Map -->
    <div class="col-12 col-lg-7 mb-4 mb-lg-0 d-flex flex-column px-2 px-lg-3">
        <h4 class="mb-3 text-dark">1. Pick a Location</h4>
        <div id="picker-map"></div>
        <div class="text-muted mt-2 small">
            <strong>Tip:</strong> Click anywhere on the map to automatically fill in the coordinates.
        </div>
    </div>

    <!-- Right Column: Form & Results -->
    <div class="col-12 col-lg-5 d-flex flex-column px-2 px-lg-3">
        <h4 class="mb-3 text-dark">2. Analyze Suitability</h4>
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-primary text-white text-center py-3">
                <h5 class="mb-0">Coordinates</h5>
            </div>
            <div class="card-body p-4">
                <form id="predictForm">
                    <div class="row">
                        <div class="col-6 mb-4">
                            <label class="form-label fw-bold">Latitude</label>
                            <input type="number" step="any" class="form-control" id="lat" required placeholder="e.g., 44.8016">
                        </div>
                        <div class="col-6 mb-4">
                            <label class="form-label fw-bold">Longitude</label>
                            <input type="number" step="any" class="form-control" id="lon" required placeholder="e.g., -0.6040">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">Analyze & Predict</button>
                </form>

                <div id="resultBox" class="mt-4 p-3 rounded" style="display: none; background-color: #f8f9fa; border: 1px solid #dee2e6;">
                    <h4 id="predictionResult" class="text-center mb-3"></h4>
                    <hr>
                    <h6 class="text-muted fw-bold mb-2">Collected Environmental Data:</h6>
                    <ul class="list-group list-group-flush" id="dataList">
                        <!-- Data will be injected here -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    // --- MAP INITIALIZATION ---
    // Start centered on Europe (a famous wine region)
    var map = L.map('picker-map').setView([45.0, 5.0], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var currentMarker = null;

    // --- MAP CLICK EVENT ---
    map.on('click', function(e) {
        var lat = e.latlng.lat.toFixed(6);
        var lon = e.latlng.lng.toFixed(6);

        // Update the input fields
        document.getElementById('lat').value = lat;
        document.getElementById('lon').value = lon;

        // Place or move the marker
        if (currentMarker) {
            currentMarker.setLatLng(e.latlng);
        } else {
            currentMarker = L.marker(e.latlng).addTo(map);
        }

        // Hide previous results if user picks a new location
        document.getElementById('resultBox').style.display = 'none';
    });

    // --- FORM SUBMISSION ---
    document.getElementById('predictForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.querySelector('button');
        btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Analyzing Data...`;
        btn.disabled = true;

        const lat = document.getElementById('lat').value;
        const lon = document.getElementById('lon').value;

        try {
            const response = await fetch('/api/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: parseFloat(lat), lon: parseFloat(lon) })
            });

            const result = await response.json();

            const resultBox = document.getElementById('resultBox');
            const title = document.getElementById('predictionResult');
            const list = document.getElementById('dataList');

            resultBox.style.display = 'block';

            if (result.suitable) {
                title.innerHTML = "🍇 Excellent! Land is SUITABLE.";
                title.className = "text-success text-center mb-3";
                resultBox.style.borderColor = "#28a745";
                if(currentMarker) currentMarker.bindPopup("<b>Suitable</b>").openPopup();
            } else {
                title.innerHTML = "❌ Poor conditions. NOT SUITABLE.";
                title.className = "text-danger text-center mb-3";
                resultBox.style.borderColor = "#dc3545";
                if(currentMarker) currentMarker.bindPopup("<b>Not Suitable</b>").openPopup();
            }

            list.innerHTML = `
                <li class="list-group-item bg-transparent d-flex justify-content-between"><b>Mid-Year Temp:</b> <span>${result.data_collected.mid_year_temp} °C</span></li>
                <li class="list-group-item bg-transparent d-flex justify-content-between"><b>Precipitation:</b> <span>${result.data_collected.precipitation} mm</span></li>
                <li class="list-group-item bg-transparent d-flex justify-content-between"><b>Elevation:</b> <span>${result.data_collected.elevation} m</span></li>
                <li class="list-group-item bg-transparent d-flex justify-content-between"><b>Frost Risk:</b> <span>${result.data_collected.frost_risk}</span></li>
                <li class="list-group-item bg-transparent d-flex justify-content-between"><b>NDVI:</b> <span>${result.data_collected.ndvi}</span></li>
                <li class="list-group-item bg-transparent d-flex justify-content-between"><b>NDWI:</b> <span>${result.data_collected.ndwi}</span></li>
            `;
        } catch (error) {
            alert("An error occurred while fetching predictions.");
        } finally {
            btn.innerText = "Analyze & Predict";
            btn.disabled = false;
        }
    });
</script>
{% endblock %}
