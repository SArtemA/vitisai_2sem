{% extends "base.html" %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    #map-wrapper { flex: 1; display: flex; flex-direction: column; min-height: 500px; }
    #map { flex: 1; width: 100%; border-radius: 8px; border: 2px solid #dee2e6; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="m-0 text-dark">Карта анализа виноградников</h2>
    <span class="badge bg-secondary" id="count-badge">Загрузка точек...</span>
</div>

<div id="map-wrapper">
    <div id="map"></div>
</div>

<script>
    // Initialize map centered on a neutral location
    var map = L.map('map').setView([20.0, 0.0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Fetch database locations via FastAPI
    fetch('/api/vineyards')
        .then(response => response.json())
        .then(data => {
            console.log("Data received from API:", data); // DEBUG: Check browser console
            document.getElementById('count-badge').innerText = data.length + " точек найдено";

            data.forEach(v => {
                // IMPORTANT: Ensure we match the SQLAlchemy column names exactly
                // We use || 0 as a fallback to prevent .toFixed() from crashing on nulls
                let lat = v.lat;
                let lon = v.lon;
                let is_suitable = v.is_suitable;
                let elev = v.elevation_GEE_USGS_30m || 0;
                let slope = v.slope_GEE_USGS_30m || 0;
                let temp = v.mid_year_temp || 0;
                let ndvi = v.ndvi || 0;

                let color = is_suitable ? "#28a745" : "#dc3545";
                let status = is_suitable ? "Подходящий (виноградник)" : "Не подходит (отрицательный результат)";

                // Create the marker
                let marker = L.circleMarker([lat, lon], {
                    color: color,
                    radius: 7,
                    fillOpacity: 0.7,
                    weight: 2
                }).addTo(map);

                // Create the popup content
                let popupContent = `
                    <div style="min-width: 150px;">
                        <h6 style="color:${color}; border-bottom: 1px solid #ccc; padding-bottom: 5px;">
                            <b>${status}</b>
                        </h6>
                        <table class="table table-sm table-borderless mb-0" style="font-size: 12px;">
                            <tr><td><b>Высота над уровнем моря:</b></td><td>${elev.toFixed(1)}m</td></tr>
                            <tr><td><b>Уклон:</b></td><td>${slope.toFixed(1)}°</td></tr>
                            <tr><td><b>Температура:</b></td><td>${temp.toFixed(1)}°C</td></tr>
                            <tr><td><b>NDVI:</b></td><td>${ndvi.toFixed(2)}</td></tr>
                        </table>
                    </div>
                `;

                marker.bindPopup(popupContent);
            });
        })
        .catch(err => {
            console.error("Error loading vineyards:", err);
            document.getElementById('count-badge').innerText = "Error loading data";
        });
</script>
{% endblock %}
