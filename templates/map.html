{% extends "base.html" %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    /* Expandable container for the map */
    #map-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 400px; /* Minimum height for very small devices */
    }
    #map {
        flex: 1; /* Stretches to fill available height */
        width: 100%;
        border-radius: 8px;
        border: 2px solid #dee2e6;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="m-0 text-dark">Known Vineyards & AI Predictions</h2>
</div>

<div id="map-wrapper">
    <div id="map"></div>
</div>

<script>
    var map = L.map('map').setView([45.0, 5.0], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    fetch('/api/vineyards')
        .then(response => response.json())
        .then(data => {
            data.forEach(v => {
                let color = v.is_suitable ? "#28a745" : "#dc3545"; // Bootstrap green/red
                let status = v.is_suitable ? "Suitable" : "Not Suitable";

                let marker = L.circleMarker([v.lat, v.lon], {
                    color: color, radius: 8, fillOpacity: 0.8, weight: 2
                }).addTo(map);

                marker.bindPopup(`
                    <h6 style="color:${color}; margin-bottom:5px;"><b>${status}</b></h6>
                    <b>Temp:</b> ${v.mid_year_temp.toFixed(1)} °C<br>
                    <b>Precip:</b> ${v.precipitation.toFixed(0)} mm<br>
                    <b>Elevation:</b> ${v.elevation.toFixed(0)} m<br>
                    <b>NDVI:</b> ${v.ndvi.toFixed(2)}
                `);
            });
        });
</script>
{% endblock %}
