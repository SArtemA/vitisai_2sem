<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Crucial for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогнозирование виноградников</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS for mobile navbar toggle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Flexbox setup to make the app take full screen height */
        html, body { height: 100%; margin: 0; display: flex; flex-direction: column; background-color: #f8f9fa; }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        /* Make nav links more prominent */
        .nav-link {
            font-weight: 600;
            font-size: 1.1rem;
        }
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .btn-custom-blue {
         background: #0d6efd;
         color: #fff;
         border: 1px solid #0d6efd;
         transition: all 0.3s ease;
        }
        .btn-custom-blue:hover {
         background: #fff;
         color: #0d6efd;
         border-color: #fff;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <!-- Using container-fluid so the navbar stretches -->
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">🍇 VitiPredict</a>

            <!-- Hamburger menu button for small screens -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2 align-items-center">
                    <li class="nav-item">
                        <a class="btn btn-custom-blue btn-sm px-3" href="/">Карта виноградников</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-custom-blue btn-sm px-3" href="/predict_page">Оценка участка</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Using container-fluid so content expands to screen width -->
    <div class="container-fluid px-4 mt-4 mb-4 main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
