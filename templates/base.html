<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Crucial for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виноградовый предсказатель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS for mobile navbar toggle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* Flexbox setup to make the app take full screen height */
        html, body { height: 100%; margin: 0; display: flex; flex-direction: column; background-color: #f8f9fa; }
        .main-content { flex: 1; display: flex; flex-direction: column; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <!-- Using container-fluid so the navbar stretches -->
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">🍇 VitiPredict</a>

            <!-- Hamburger menu button for small screens -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Карта</a></li>
                    <li class="nav-item"><a class="nav-link" href="/predict_page">Анализ местности</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Using container-fluid so content expands to screen width -->
    <div class="container-fluid px-4 mt-4 mb-4 main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
