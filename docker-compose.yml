version: '3.8'


services:
  web:
    build: .
    container_name: vitis_ai
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - RETRAIN_NOTIFY_AFTER_FAILURES=${RETRAIN_NOTIFY_AFTER_FAILURES:-4}
    volumes:
      # Mounts host directory to container so SQLite databases are persistent
      - ./databases:/pm_2_sem/databases
      # Mounts host models directory so you can update ML artifacts without rebuilding
      - ./models:/pm_2_sem/models
    restart: always
