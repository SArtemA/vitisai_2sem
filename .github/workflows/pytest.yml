name: lintntest

on:
  push:
    branches: [ ML_extended ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -q -r requirements.txt 

    - name: Lint with flake8 (Critical Errors Only)
      run: |
        # Stop the build if there are Python syntax errors (E9, F7) or undefined names (F82)
        # E9: Syntax/Runtime, F63: Comparison anomalies, F7: Syntax anomalies, F82: Undefined name errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Lint with flake8 (Style Warnings)
      run: |
        # exit-zero treats all PEP8/style warnings as non-blocking warnings (does not stop the build)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Tests
      run: |
        pytest tests_.py/ -v