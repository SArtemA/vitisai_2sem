[project]
name = "vitisai-2sem"
version = "0.1.0"
description = "Веб-приложение для оценки пригодности участка под виноградарство и рекомендации сортов винограда"
authors = [
    { name = "Бакилин Михаил Андреевич" },
    { name = "Елькин Лев Олегович" },
    { name = "Саттаров Артем Альбертович" },
    { name = "Хакимзянов Илья Эдуардович" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.2.0,<4.0.0)",
    "numpy (>=1.26.4,<3.0.0)",
    "joblib (>=1.5.3,<1.6.0)",
    "xgboost (>=3.2.0,<3.3.0)",
    "scikit-learn (>=1.9.0,<1.10.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "pydantic (>=2.13.4,<2.14.0)",
    "sqlalchemy (>=2.0.50,<2.1.0)",
    "earthengine-api (>=1.7.29,<1.8.0)",
    "requests (>=2.32.0,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
flake8 = ">=7.4.1,<8.0.0"
black = ">=25.0.0,<26.0.0"
isort = ">=6.0.0,<7.0.0"
pre-commit = ">=4.0.0,<5.0.0"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
